# OpenMycoNet STAGING -- /admin nur mit Client-Zertifikat (PC zu Hause)
# ---------------------------------------------------------------------------
# Wie nginx_admin_mtls.conf, aber fuer staging.openmyconet.de (gunicorn :5001).
# Einbinden NUR im 443-server-Block von staging.openmyconet.de (macht
# deploy/root_admin_zertifikat.sh staging):
#
#     include /etc/nginx/snippets/omn_admin_mtls_staging.conf;
#
# Das Basic-Auth-Passwort der Staging-Site gilt weiter zusaetzlich. Deploy und
# Pruefungen (deploy_staging.sh, MCC-Ampel) gehen direkt an 127.0.0.1:5001 und
# sind davon nicht betroffen. Gleiche CA wie Prod (/etc/nginx/omn-admin-ca.crt).

ssl_client_certificate /etc/nginx/omn-admin-ca.crt;
ssl_verify_client      optional;
ssl_verify_depth       1;

server_tokens off;

location ^~ /admin {
    if ($ssl_client_verify != SUCCESS) {
        return 403 "Der Staging-Admin-Bereich ist nur vom PC mit Client-Zertifikat erreichbar.\n";
    }
    default_type text/plain;
    proxy_pass http://127.0.0.1:5001;
}
