<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>OpenMycoNet — Passwort ändern</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; color: #eee; background: #0a0f0a; padding: 0 20px; }
        h1 { color: #4caf50; }
        label { display: block; margin-top: 16px; color: #aaa; font-size: 0.9em; }
        input { width: 100%; padding: 8px; margin: 6px 0; background: #1a2a1a; color: #eee; border: 1px solid #4caf50; border-radius: 4px; box-sizing: border-box; }
        button { background: #4caf50; color: #000; padding: 10px 24px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 16px; }
        .msg { color: #4caf50; margin: 16px 0; padding: 10px; background: #1a2a1a; border-radius: 4px; }
        .err { color: #f44336; margin: 16px 0; padding: 10px; background: #1a2a1a; border-radius: 4px; }
        nav { margin-bottom: 30px; }
        a { color: #4caf50; }
    </style>
</head>
<body>
    <nav>
        {% if session.admin_role == 'superadmin' %}
            <a href="{{ url_for('admin.admin') }}">← Admin</a>
        {% else %}
            <a href="{{ url_for('admin.news_admin') }}">← Übersicht</a>
        {% endif %}
        · <a href="{{ url_for('admin.logout') }}">Logout</a>
    </nav>
    <h1>🔑 Passwort ändern</h1>

    {% if nachricht %}<p class="msg">{{ nachricht }}</p>{% endif %}
    {% if fehler %}<p class="err">{{ fehler }}</p>{% endif %}

    <form method="POST">
        <label>Aktuelles Passwort</label>
        <input type="password" name="aktuelles_passwort" required>

        <label>Neues Passwort (mind. 8 Zeichen)</label>
        <input type="password" name="neues_passwort" required minlength="8">

        <label>Neues Passwort wiederholen</label>
        <input type="password" name="neues_passwort_wiederholt" required minlength="8">

        <button type="submit">Speichern</button>
    </form>
</body>
</html>
