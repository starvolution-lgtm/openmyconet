# OpenMycoNet — Static-Auslieferung + Kompression fuer nginx
# ---------------------------------------------------------------------------
# Einbinden statt des bisherigen  location / { proxy_pass ... }  in JEDEM
# echten server-Block (www.openmyconet.de UND api.openmyconet.de):
#
#     include /etc/nginx/snippets/omn_static.conf;
#
# Zweck:
#  - Statische Dateien (css/js/mp3/bilder/fonts) direkt von der Platte statt
#    durch die 2 gunicorn-Worker  ->  Worker frei fuer echte Requests
#  - 30 Tage Browser-Cache auf unveraenderliche Assets (bisher: no-cache)
#  - gzip fuer json/css/js (bisher nur HTML komprimiert)
#  - translations.json + sw.js bleiben "frisch" wie bisher, aber komprimiert
#
# Flask liefert Static unter Domain-Root aus (static_url_path=''), daher ist
# der URL-Pfad == Pfad unter dem static-Ordner. try_files ... @flask faellt
# sauber auf die App zurueck, falls eine Datei nicht auf der Platte liegt.

root /home/omn/app/app/static;

gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_min_length   512;
gzip_types        application/json application/javascript text/javascript
                  text/css image/svg+xml application/manifest+json;

# Proxy-Header einmal zentral (werden in die location-Bloecke vererbt)
proxy_set_header  Host $host;
proxy_set_header  X-Real-IP $remote_addr;
proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header  X-Forwarded-Proto $scheme;

# Service Worker: nie langfristig cachen, sonst sehen Clients Updates zu spaet
location = /sw.js {
    try_files $uri @flask;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
}

# Uebersetzungen: gleiche Frische wie bisher (revalidieren), aber jetzt gzip
location = /translations.json {
    try_files $uri @flask;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
}

# Nutzer-Uploads (Foerderer-Logos, News-Bilder): defense-in-depth. Wird eine
# hochgeladene Datei direkt aufgerufen (statt per <img>), verhindert diese CSP,
# dass evtl. durchgerutschtes aktives SVG-/HTML-Konstrukt in unserer Origin
# laeuft. ^~ hat Vorrang vor der Datei-Endungs-location darunter.
location ^~ /uploads/ {
    try_files $uri @flask;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; sandbox";
}

# Unveraenderliche Assets: 30 Tage Cache
location ~* \.(css|js|mp3|jpe?g|png|webp|svg|woff2?|ico|gif)$ {
    try_files $uri @flask;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff";
}

# Alles andere: an die Flask-App
location / {
    proxy_pass http://127.0.0.1:5000;
}

location @flask {
    proxy_pass http://127.0.0.1:5000;
}
