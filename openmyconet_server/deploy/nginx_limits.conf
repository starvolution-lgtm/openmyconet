# OpenMycoNet -- Anfrage-Grenzen fuer /login und /api/ (Prod, gunicorn :5000)
# ---------------------------------------------------------------------------
# Einbinden im 443-server-Block von api.openmyconet.de UND www.openmyconet.de,
# hinter omn_static.conf (dort stehen die proxy_set_header, die hier vererbt werden):
#
#     include /etc/nginx/snippets/omn_limits.conf;
#
# Macht deploy/root_nginx_limits_fail2ban.sh. Zonen: nginx_limits_zonen.conf.
# Exakte/^~-locations haben Vorrang vor der Datei-Endungs-Regex in omn_static.conf.

location = /login {
    limit_req zone=omn_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:5000;
}

location = /login/2fa {
    limit_req zone=omn_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:5000;
}

# BioComm-Bridges laden nach einer Funkpause viele Pakete am Stueck hoch und haben
# eigene Schluessel + Pruefungen -> bewusst OHNE Grenze.
location ^~ /api/v2/biocomm/ {
    proxy_pass http://127.0.0.1:5000;
}

location ^~ /api/ {
    limit_req zone=omn_api burst=30 nodelay;
    proxy_pass http://127.0.0.1:5000;
}
