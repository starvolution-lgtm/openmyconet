# OpenMycoNet -- Anfrage-Grenzen je IP (http-Kontext)
# ---------------------------------------------------------------------------
# Landet als /etc/nginx/conf.d/omn_limits.conf (Ubuntu-nginx.conf laedt conf.d/*.conf
# im http-Block). Die Zonen werden in den Snippets nginx_limits(_staging).conf benutzt.
# Eingerichtet von deploy/root_nginx_limits_fail2ban.sh (seit 23.10.2026).
#
# Die App hat eigene, feinere Grenzen (spam_schutz.py: Login 8 Fehlversuche/15 min,
# Chat, Registrierung). nginx bremst davor grob und billig, ohne dass gunicorn-
# Worker belegt werden; 429-Zeilen im error.log speisen fail2ban (nginx-limit-req).

# Login + 2FA: 10 Anfragen/Minute je IP (ein normaler Login braucht 2-4)
limit_req_zone $binary_remote_addr zone=omn_login:10m rate=10r/m;
# Oeffentliche JSON-APIs (Registrierung, Bewerbung, Chat, Status): 60/Minute je IP
limit_req_zone $binary_remote_addr zone=omn_api:10m rate=60r/m;

limit_req_status 429;
limit_req_log_level warn;
