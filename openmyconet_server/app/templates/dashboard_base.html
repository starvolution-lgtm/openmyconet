<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}OpenMycoNet — Dashboard{% endblock %}</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; color: #eee; background: #0a0f0a; padding: 0 20px; }
        h1, h2 { color: #4caf50; }
        a { color: #4caf50; }
        nav { margin-bottom: 30px; font-size: 0.9em; }
        .msg { color: #4caf50; margin: 16px 0; padding: 10px; background: #1a2a1a; border-radius: 4px; }
        .err { color: #f44336; margin: 16px 0; padding: 10px; background: #1a2a1a; border-radius: 4px; }
        .card { background: #1a2a1a; padding: 20px; border-radius: 6px; margin: 16px 0; }
        /* Mykorrhiza-Textur: nur auf dem Login-Bereich, reines Ambiente, extrem
           geringe Deckkraft -- .card selbst bleibt unangetastet fuer alle anderen Views. */
        .texture-card { position: relative; overflow: hidden; }
        .texture-card::before {
            content: ''; position: absolute; inset: 0;
            background-image: url('/mykorrhiza-tile.jpg');
            background-repeat: repeat; background-size: 320px 320px;
            opacity: 0.08; pointer-events: none; z-index: 0;
        }
        .texture-card > * { position: relative; z-index: 1; }
        .label { color: #aaa; font-size: 0.85em; }
        input, button { padding: 8px; margin: 6px 0; background: #1a2a1a; color: #eee; border: 1px solid #4caf50; border-radius: 4px; box-sizing: border-box; }
        input { width: 100%; }
        button { cursor: pointer; font-weight: bold; padding: 10px 24px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th { text-align: left; color: #4caf50; padding: 6px 8px; font-size: 0.85em; }
        td { padding: 6px 8px; border-bottom: 1px solid #24342466; font-size: 0.9em; }
    </style>
</head>
<body>
    <nav>
        🍄 OpenMycoNet Dashboard
        {% if nutzer %}· {{ nutzer.name }} · <a href="{{ url_for('dashboard.logout') }}">Logout</a>{% endif %}
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, msg in messages %}
            <p class="{{ 'err' if category == 'error' else 'msg' }}">{{ msg }}</p>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
<script>
/* CSRF: haengt das Session-Token (siehe csrf.py) an jedes POST-Formular an. */
(function () {
  var t = {{ csrf_token()|tojson }};
  document.querySelectorAll('form').forEach(function (f) {
    var m = (f.getAttribute('method') || 'get').toLowerCase();
    if (m === 'post' && !f.querySelector('input[name="_csrf"]')) {
      var i = document.createElement('input');
      i.type = 'hidden'; i.name = '_csrf'; i.value = t;
      f.appendChild(i);
    }
  });
})();
</script>
</body>
</html>
