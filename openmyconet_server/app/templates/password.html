{% extends "admin_base.html" %}
{% block title %}OpenMycoNet — Passwort ändern{% endblock %}
{% block heading %}🔑 Passwort ändern{% endblock %}
{% block content %}

{% if nachricht %}<p class="msg">{{ nachricht }}</p>{% endif %}
{% if fehler %}<p class="err">{{ fehler }}</p>{% endif %}

<form method="POST" style="max-width:420px;">
    <label>Aktuelles Passwort</label>
    <input type="password" name="aktuelles_passwort" required>

    <label>Neues Passwort (mind. 8 Zeichen)</label>
    <input type="password" name="neues_passwort" required minlength="8">

    <label>Neues Passwort wiederholen</label>
    <input type="password" name="neues_passwort_wiederholt" required minlength="8">

    <button type="submit">Speichern</button>
</form>
{% endblock %}
