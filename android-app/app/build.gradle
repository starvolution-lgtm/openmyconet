plugins {
    id 'com.android.application'
}

android {
    namespace 'de.openmyconet.kontrollzentrum'
    compileSdk 34

    defaultConfig {
        applicationId "de.openmyconet.kontrollzentrum"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Stellt die generische LauncherActivity bereit -- der komplette TWA-Wrapper
    // wird ueber Manifest-Metadaten konfiguriert, kein eigener Code noetig.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
