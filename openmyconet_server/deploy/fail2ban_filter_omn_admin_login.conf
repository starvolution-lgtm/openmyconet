# OpenMycoNet -- fail2ban-Filter fuer fehlgeschlagene Admin-Logins
# Landet als /etc/fail2ban/filter.d/omn-admin-login.conf.
# nginx-Standardformat "combined":
#   1.2.3.4 - - [23/Oct/2026:10:00:00 +0200] "POST /login?weiter=/mcc HTTP/2.0" 200 3456 "-" "UA"
# Fehlversuch = 200 auf POST /login (Erfolg = 302). 429 (nginx-Grenze) zaehlt der
# Jail nginx-limit-req. /login/2fa bewusst nicht: dort stimmte das Passwort schon.
# \[[^\]]*\]: fail2ban schneidet das erkannte Datum vorher heraus (dann steht "[]").
# Pruefen: fail2ban-regex /var/log/nginx/access.log omn-admin-login

[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "POST /login(?:\?\S*)? HTTP/[0-9.]+" 200
ignoreregex =
