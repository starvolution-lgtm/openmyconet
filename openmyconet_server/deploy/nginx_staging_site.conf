# nginx-Site fuer die STAGING-Instanz  ->  /etc/nginx/sites-available/staging.openmyconet.de
# Als root (omn hat kein sudo -> ssh -t ... "su - root -c ...").
#
# Voraussetzungen:
#   1. DNS: A-Record  staging.openmyconet.de -> 77.42.64.162  (All-inkl KAS)
#   2. Basic-Auth-Datei:
#        apt-get install -y apache2-utils   # falls htpasswd fehlt
#        htpasswd -c /etc/nginx/.htpasswd-staging omn
#   3. Diese Datei nach /etc/nginx/sites-available/ kopieren, dann:
#        ln -s /etc/nginx/sites-available/staging.openmyconet.de /etc/nginx/sites-enabled/
#        nginx -t
#   4. TLS-Zertifikat:
#        certbot --nginx -d staging.openmyconet.de
#      (certbot ergaenzt die ssl_*-Zeilen + den :443-Block selbst; danach ggf.
#       diese Datei nur noch als Referenz behalten)
#   5. systemctl reload nginx
#
# Ergebnis: https://staging.openmyconet.de (Basic-Auth) -> gunicorn :5001

server {
    listen 80;
    listen [::]:80;
    server_name staging.openmyconet.de;

    # Vor certbot: Challenge zulassen, Rest auf https lenken.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.openmyconet.de;

    # certbot --nginx setzt diese 4 Zeilen; hier als Referenz:
    ssl_certificate     /etc/letsencrypt/live/staging.openmyconet.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.openmyconet.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Staging ist nicht oeffentlich -- Basic-Auth + kein Indexieren.
    auth_basic           "OpenMycoNet Staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 15m;

    root /home/omn/app-staging/app/static;

    gzip on;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /sw.js            { try_files $uri @flask; add_header Cache-Control "no-cache"; }
    location = /translations.json { try_files $uri @flask; add_header Cache-Control "no-cache"; }
    location ^~ /uploads/ {
        try_files $uri @flask;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; sandbox";
        add_header X-Content-Type-Options "nosniff";
    }
    location ~* \.(css|js|mp3|jpe?g|png|webp|svg|woff2?|ico|gif)$ { try_files $uri @flask; }

    location /        { proxy_pass http://127.0.0.1:5001; }
    location @flask   { proxy_pass http://127.0.0.1:5001; }
}
