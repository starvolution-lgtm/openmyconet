<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>OpenMycoNet — Registrierung</title>
<link rel="stylesheet" href="{{ asset('register.css') }}">
</head>
<body>
    <h1>🍄 OpenMycoNet</h1>
    <h2>Registrierung</h2>

    {% if nachricht %}
        <p class="msg">{{ nachricht }}</p>
    {% endif %}
    {% if fehler %}
        <p class="err">{{ fehler }}</p>
    {% endif %}

    <form method="POST">
        <label>Name</label>
        <input type="text" name="name" required>

        <label>E-Mail</label>
        <input type="email" name="email" required>

        <label>Sprache</label>
        <select name="sprache">
            <option value="de">Deutsch</option>
            <option value="en">English</option>
            <option value="nl">Nederlands</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
        </select>

        <label>Land</label>
        <input type="text" name="land">

        <label>Gruppe</label>
        <select name="gruppe">
            <option value="allgemein">Allgemein / Interessiert</option>
            <option value="biocomm">BioComm Hardware-Nutzer</option>
            <option value="wissenschaft">Wissenschaft / Forschung</option>
            <option value="foerderer">Förderer / Sponsor</option>
        </select>

        <button type="submit">Registrieren</button>
    </form>
</body>
</html>
