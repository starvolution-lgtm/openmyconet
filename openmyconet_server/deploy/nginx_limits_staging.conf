# OpenMycoNet STAGING -- Anfrage-Grenzen fuer /login und /api/ (gunicorn :5001)
# ---------------------------------------------------------------------------
# Wie nginx_limits.conf, aber fuer staging.openmyconet.de. Einbinden im
# 443-server-Block (macht deploy/root_nginx_limits_fail2ban.sh staging):
#
#     include /etc/nginx/snippets/omn_limits_staging.conf;
#
# Proxy-Header und Basic-Auth stehen im server-Block der Staging-Site und werden
# vererbt (darum hier KEIN proxy_set_header -- das wuerde die Vererbung abschalten).

location = /login {
    limit_req zone=omn_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:5001;
}

location = /login/2fa {
    limit_req zone=omn_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:5001;
}

# BioComm-Bridges laden nach einer Funkpause viele Pakete am Stueck hoch und haben
# eigene Schluessel + Pruefungen -> bewusst OHNE Grenze.
location ^~ /api/v2/biocomm/ {
    proxy_pass http://127.0.0.1:5001;
}

location ^~ /api/ {
    limit_req zone=omn_api burst=30 nodelay;
    proxy_pass http://127.0.0.1:5001;
}
