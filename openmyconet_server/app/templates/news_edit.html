<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>OpenMycoNet — Beitrag bearbeiten</title>
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; color: #eee; background: #0a0f0a; padding: 0 20px; }
        h1 { color: #4caf50; }
        label { display: block; margin-top: 16px; color: #aaa; font-size: 0.9em; }
        input, select, textarea { width: 100%; padding: 8px; margin: 6px 0; background: #1a2a1a; color: #eee; border: 1px solid #4caf50; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 180px; resize: vertical; }
        #editor { height: 220px; background: #fff; color: #000; border-radius: 0 0 4px 4px; }
        .ql-toolbar { background: #1a2a1a; border-color: #4caf50 !important; border-radius: 4px 4px 0 0; }
        .ql-container { border-color: #4caf50 !important; }
        .ql-toolbar .ql-stroke { stroke: #eee; }
        .ql-toolbar .ql-fill { fill: #eee; }
        .ql-toolbar .ql-picker-label { color: #eee; }
        button { background: #4caf50; color: #000; padding: 10px 24px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 16px; }
        .err { color: #f44336; margin: 16px 0; padding: 10px; background: #1a2a1a; border-radius: 4px; }
        nav { margin-bottom: 30px; }
        a { color: #4caf50; }
        img.vorschau { max-width: 300px; display: block; margin-top: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <nav><a href="{{ url_for('admin.news_admin') }}">← News verwalten</a> · <a href="{{ url_for('admin.change_password') }}">Passwort ändern</a> · <a href="{{ url_for('admin.logout') }}">Logout</a></nav>
    <h1>🍄 Beitrag bearbeiten</h1>

    {% if fehler %}
        <p class="err">{{ fehler }}</p>
    {% endif %}

    <form method="POST" enctype="multipart/form-data" id="news-form">
        <label>Titel</label>
        <input type="text" name="titel" value="{{ news.titel }}" required>

        <label>Untertitel (optional)</label>
        <input type="text" name="untertitel" value="{{ news.untertitel or '' }}">

        <label>Sprache</label>
        <select name="sprache">
            <option value="de" {% if news.sprache == 'de' %}selected{% endif %}>Deutsch</option>
            <option value="en" {% if news.sprache == 'en' %}selected{% endif %}>English</option>
            <option value="nl" {% if news.sprache == 'nl' %}selected{% endif %}>Nederlands</option>
            <option value="fr" {% if news.sprache == 'fr' %}selected{% endif %}>Français</option>
            <option value="es" {% if news.sprache == 'es' %}selected{% endif %}>Español</option>
        </select>

        <label>Bild {% if news.bild_dateiname %}(aktuelles Bild ersetzen){% else %}(optional){% endif %}</label>
        {% if news.bild_dateiname %}
            <img class="vorschau" src="{{ url_for('static', filename='uploads/news/' + news.bild_dateiname) }}" alt="">
        {% endif %}
        <input type="file" name="bild" accept="image/png,image/jpeg,image/webp,image/gif">

        <label>Inhalt</label>
        <div id="editor"></div>
        <textarea name="inhalt" id="inhalt-feld" style="display:none;">{{ news.inhalt }}</textarea>

        <label>Tags (kommagetrennt, optional)</label>
        <input type="text" name="tags" value="{{ news.tags or '' }}" placeholder="z.B. Mykorrhiza, Forschung, Update">

        <button type="submit">Speichern</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    <script>
        const quill = new Quill('#editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ header: [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline'],
                    [{ list: 'ordered' }, { list: 'bullet' }],
                    ['link', 'image'],
                    ['clean']
                ]
            }
        });
        quill.root.innerHTML = document.getElementById('inhalt-feld').value;
        document.getElementById('news-form').addEventListener('submit', function (e) {
            if (!quill.getText().trim()) {
                e.preventDefault();
                alert('Bitte einen Inhalt eingeben.');
                return;
            }
            document.getElementById('inhalt-feld').value = quill.root.innerHTML;
        });
    </script>
</body>
</html>
