# nginx-Site fuer STAGING (staging.openmyconet.de) -- NUR :80.
# certbot --nginx baut daraus beim ersten Lauf den :443-Block + http->https.
# Wird von deploy/setup_staging_nginx.sh nach /etc/nginx/sites-available/ kopiert.
#
# Voraussetzung: DNS-A-Record staging.openmyconet.de -> 77.42.64.162 (All-inkl KAS).

server {
    listen 80;
    listen [::]:80;
    server_name staging.openmyconet.de;

    # ACME-Challenge (certbot) OHNE Basic-Auth erreichbar lassen.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    # Staging ist nicht oeffentlich.
    auth_basic           "OpenMycoNet Staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 15m;
    root /home/omn/app-staging/app/static;

    gzip on;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /sw.js             { try_files $uri @flask; add_header Cache-Control "no-cache"; }
    location = /translations.json { try_files $uri @flask; add_header Cache-Control "no-cache"; }
    location ^~ /uploads/ {
        try_files $uri @flask;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; sandbox";
        add_header X-Content-Type-Options "nosniff";
    }
    location ~* \.(css|js|mp3|jpe?g|png|webp|svg|woff2?|ico|gif)$ { try_files $uri @flask; }

    location /      { proxy_pass http://127.0.0.1:5001; }
    location @flask { proxy_pass http://127.0.0.1:5001; }
}
