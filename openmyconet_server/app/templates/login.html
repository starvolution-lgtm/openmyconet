{% extends "admin_base.html" %}
{% block title %}OpenMycoNet — Admin Login{% endblock %}
{% block header %}
<header class="admin-top">
  <div>
    <span class="eyebrow">OpenMycoNet · Admin</span>
    <h1>🍄 Admin Login</h1>
  </div>
</header>
{% endblock %}
{% block content %}
<div style="max-width:380px; margin:2rem auto 0;">
  {% if fehler %}
    <p class="err">{{ fehler }}</p>
  {% endif %}

  <form method="POST">
    <label>Benutzername</label>
    <input type="text" name="username" required autofocus>

    <label>Passwort</label>
    <input type="password" name="password" required>

    <button type="submit">Anmelden</button>
  </form>
</div>
{% endblock %}
