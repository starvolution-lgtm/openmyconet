# OpenMycoNet -- /admin nur mit Client-Zertifikat (PC zu Hause)
# ---------------------------------------------------------------------------
# Einbinden NUR im 443-server-Block von api.openmyconet.de (macht
# deploy/root_admin_zertifikat.sh):
#
#     include /etc/nginx/snippets/omn_admin_mtls.conf;
#
# www.openmyconet.de/admin leitet die App ohnehin per 308 auf api um, dort greift
# die Pruefung. Offen bleiben bewusst /login, /login/2fa, /logout und /mcc -- das
# Server-MCC soll auch vom Handy gehen (Schutz dort: Passwort + 2FA-Pflicht).
#
# "optional": Browser/Geraete ohne Zertifikat (Handy, Bridges, PayPal-IPN)
# verbinden sich ganz normal; nur /admin verlangt ein gueltiges Zertifikat.
# Ausgestellt von der eigenen CA (deploy/admin_zertifikat_erstellen.sh, Schluessel
# nur am PC); der Server kennt nur deren oeffentliches Zertifikat.

ssl_client_certificate /etc/nginx/omn-admin-ca.crt;
ssl_verify_client      optional;
ssl_verify_depth       1;

# keine nginx-Versionsnummer in Fehlerseiten und Server-Header
server_tokens off;

location ^~ /admin {
    if ($ssl_client_verify != SUCCESS) {
        return 403 "Der Admin-Bereich ist nur vom PC mit Client-Zertifikat erreichbar.\nUnterwegs: https://api.openmyconet.de/mcc\n";
    }
    default_type text/plain;
    proxy_pass http://127.0.0.1:5000;
}
